apiVersion: v1
kind: ConfigMap
metadata:
  name: go-enviroment
data:
  SVC_PORT: "8099"
  NAME: "MUTEDEVOPS_pty"
---
apiVersion: v1
kind: Secret
metadata:
  name: credentials
stringData:
  APIKEY: sb_publishable_a8728I7obHYwwnUpDH9vpw_B1Zp_Xeo
  ID: lvebgyjzcskmiqnthuua
  EMAIL: moisesluis0403@gmail.com
  PASSWORD: _Moises0403
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-app-go
  namespace: default
  labels:
    app: go-api
    env: test
  annotations:
    kubernetes.io/change-cause: "Fix: Adding template html new and connection with database - version 3"

spec:
  revisionHistoryLimit: 5
  replicas: 2

  selector:
    matchLabels:
      app: go-api
      env: test

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: go-api
        env: test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: go-api
          image: moises0403/golang-api:v3
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: go-enviroment
            - secretRef:
                name: credentials
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          securityContext:
            allowPrivilegeEscalation: false
            #readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: svc-go-api
  labels:
    app: go-api
    env: test

spec:
  type: NodePort

  selector:
    app: go-api
    env: test

  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8080
      nodePort: 30090
